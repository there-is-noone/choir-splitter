[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choirsplit"
version = "0.1.0"
description = "Turn choir scores into separate MP3 practice tracks for every voice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["music21>=9", "numpy>=1.24", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
test = ["pytest>=7"]
# The desktop app works without these too: they add a modern light/dark theme and
# dragging files onto the window.
gui = ["sv-ttk>=2.6", "darkdetect>=0.8", "tkinterdnd2>=0.6.4"]

[project.scripts]
choir-split = "choirsplit.cli:main"

[project.gui-scripts]
choir-split-ui = "choirsplit.gui:main"

[tool.setuptools]
packages = ["choirsplit"]

[tool.setuptools.package-data]
choirsplit = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds (OMR, long renders)",
    "omr: needs an optical music recognition engine (skipped when none is installed)",
    "musescore: needs the MuseScore command line (skipped when not installed)",
]
