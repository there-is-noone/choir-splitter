[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "choirsplit"
version = "0.1.0"
description = "Turn choir scores into separate MP3 practice tracks for every voice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["music21>=9", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
choir-split = "choirsplit.cli:main"

[tool.setuptools]
packages = ["choirsplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds (OMR, long renders)",
    "omr: needs an optical music recognition engine (skipped when none is installed)",
    "musescore: needs the MuseScore command line (skipped when not installed)",
]
